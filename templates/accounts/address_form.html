{% extends "base.html" %}{% block title %}{{ title }} | JBS Solar{% endblock %}
{% block content %}<section class="page-heading page-heading--store"><div class="shell"><p class="eyebrow eyebrow--light"><span></span> Área do cliente</p><h1>{{ title|lower|capfirst }}.</h1><p>Preencha os dados do endereço de entrega.</p></div></section><section class="account-section shell"><div class="account-card account-card--wide"><h2>{{ title }}</h2><form method="post" class="account-form account-form--wide">{% csrf_token %}{% for field in form %}<label class="account-field{% if field.name == 'is_default' %} account-field--check{% endif %}"><span>{{ field.label }}</span>{{ field }}{% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="button button--orange" type="submit">Salvar endereço</button></form></div></section>{% endblock %}
